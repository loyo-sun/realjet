locale: en

backend:
  name: github
  repo: loyo-sun/realjet
  branch: main
  site_domain: realjetech.com

publish_mode: editorial_workflow
site_url: https://realjetech.com
display_url: https://realjetech.com
logo_url: https://realjetech.com/images/realjet-logo.webp
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: products
    label: Products
    label_singular: Product
    folder: content/products
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [order, date, title, updated]
    fields:
      - { label: Title, name: title, widget: string, required: true }
      - { label: Short Description, name: description, widget: text, required: true, hint: "Used on the homepage, product list and search previews." }
      - { label: Published Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
      - { label: Updated Date, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
      - { label: Display Order, name: order, widget: number, value_type: int, min: 1, required: true, hint: "Lower numbers appear first in product listings and among recommended homepage products." }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false, required: true, hint: "Only enabled products appear in the homepage product section." }
      - { label: URL Name, name: slug, widget: string, required: true, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only."], hint: "The product series determines the published route. Do not change after publication without a redirect." }
      - label: Product Series
        name: productSeries
        widget: select
        required: true
        default: precast-production-equipment
        options:
          - { label: Contract Manufacturing, value: contract-manufacturing }
          - { label: Precast Production Equipment, value: precast-production-equipment }
          - { label: Precast Concrete Moulds, value: precast-concrete-moulds }
      - label: Mould Application Category
        name: mouldCategory
        widget: select
        required: false
        hint: "Select only for products in the Precast Concrete Moulds series."
        options:
          - { label: Bridge & Transportation Moulds, value: bridge-transportation-moulds }
          - { label: Building Component Moulds, value: building-component-moulds }
          - { label: Tunnel & Underground Moulds, value: tunnel-underground-moulds }
          - { label: Municipal & Infrastructure Moulds, value: municipal-infrastructure-moulds }
          - { label: Marine & Coastal Moulds, value: marine-coastal-moulds }
          - { label: Retaining Wall & Block Moulds, value: retaining-wall-block-moulds }
          - { label: Volumetric & Special Precast Moulds, value: volumetric-special-precast-moulds }
      - { label: Mould Group Navigation Page, name: mouldGroup, widget: boolean, default: false, required: false, hint: "Enable only when the page is a navigation hub rather than an end product card." }
      - { label: Main Product Image, name: image, widget: image, required: true, hint: "Used as the main product image and on product cards. All CMS uploads are saved in the shared media library. Use an authorised 16:9 image, ideally 1200 × 675 or larger and below 2 MB." }
      - { label: Main Image Alt, name: imageAlt, widget: string, required: true }
      - label: Product Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.alt}}"
        hint: "Add as many secondary product images as needed. The main image remains separate above."
        fields:
          - { label: Image, name: image, widget: image, required: true }
          - { label: Image Alt, name: alt, widget: string, required: true, hint: "Describe what is visible in this image." }
      - { label: Draft, name: draft, widget: boolean, default: true, required: true }
      - { label: Product Description, name: body, widget: markdown, required: true, hint: "The page already has an H1. Start sections with H2." }

  - name: insights
    label: Insights
    label_singular: Insight
    folder: content/insights
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title, updated]
    fields:
      - { label: Title, name: title, widget: string, required: true, hint: "Use one clear buyer-oriented title." }
      - { label: SEO Description, name: description, widget: text, required: true, hint: "Write one or two accurate sentences; do not repeat the title." }
      - { label: Published Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
      - { label: Updated Date, name: updated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: true }
      - { label: Show on Homepage, name: featured, widget: boolean, default: false, required: true, hint: "New articles are hidden from the homepage unless this is enabled." }
      - { label: URL Slug, name: slug, widget: string, required: true, pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only."], hint: "Do not change after publication without adding a 301 redirect." }
      - { label: Hero Image, name: image, widget: image, required: true, hint: "All CMS uploads are saved in the shared media library. Use an authorised 16:9 image, ideally 1200 × 675 or larger and below 2 MB." }
      - { label: Image Alt, name: imageAlt, widget: string, required: true, hint: "Describe the actual image in natural English." }
      - label: Article CTA
        name: ctaType
        widget: select
        required: true
        default: precast-line
        options:
          - { label: Precast Concrete Line, value: precast-line }
          - { label: Machinery Component Manufacturing, value: manufacturing }
      - { label: Draft, name: draft, widget: boolean, default: true, required: true, hint: "Keep enabled until the article is approved." }
      - { label: Body, name: body, widget: markdown, required: true, hint: "The page already has an H1. Start body sections with H2." }
