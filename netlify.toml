[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "http://www.realjetech.com/*"
  to = "https://realjetech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.realjetech.com/*"
  to = "https://realjetech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/manufacturing/"
  to = "/marketing/contract_manufacturing/"
  status = 301
  force = true

[[redirects]]
  from = "/inquiry/*"
  to = "/products/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/custom-precast-moulds/"
  to = "/precast-concrete-molds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/adjustable-and-modular-moulds/"
  to = "/precast-concrete-molds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/hydraulic-and-special-shaped-moulds/"
  to = "/precast-concrete-molds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/interlocking-concrete-armour-unit-moulds/"
  to = "/precast-concrete-molds/accropode-moulds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/wall-panel-moulds/"
  to = "/marketing/precast-concrete-molds/wall-panel-moulds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/column-and-building-beam-moulds/"
  to = "/marketing/precast-concrete-molds/column-and-building-beam-moulds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/floor-and-roof-slab-moulds/"
  to = "/marketing/precast-concrete-molds/floor-and-roof-slab-moulds/"
  status = 301
  force = true

[[redirects]]
  from = "/precast-concrete-molds/drainage-channel-moulds/"
  to = "/marketing/precast-concrete-molds/drainage-channel-moulds/"
  status = 301
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/marketing/spun-pipe-piles-production-line-v1/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
